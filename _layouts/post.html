---
layout: base
---
<main class="article" id="main">
  <p class="kicker"><a href="{{ '/blog/' | relative_url }}">Blog</a> · <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%-d %B %Y" }}</time></p>
  <h1>{{ page.title }}</h1>
  {% if page.description %}<p class="lead">{{ page.description }}</p>{% endif %}
  <div class="prose">
{{ content }}
  </div>
  <p class="back"><a class="link" href="{{ '/blog/' | relative_url }}">← All posts</a></p>
</main>
